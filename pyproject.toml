[build-system]
requires = ["setuptools>=68", "wheel", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "dope"
dynamic = ["version"]
description = "Symbolic data kernel language and sampler for scaled tabular data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "rich>=13.0",
]

[project.scripts]
dope-kernel-v1 = "dope_kernel.cli:main"

[tool.setuptools.data-files]
"." = ["Cargo.toml"]
"tools/claims" = ["tools/claims/package_version.py"]

[tool.setuptools.dynamic]
version = {attr = "dope_package_version.package_version.VERSION"}

[tool.setuptools.package-dir]
dope_package_version = "tools/claims"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
