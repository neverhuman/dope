name: Shared levels conformance
on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Seeded guests can retain inaccessible custody fixtures in their base checkout.
    # This workflow owns a separate source directory; it never cleans the seed.
    working-directory: shared-levels-source
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on:
      group: neverhuman-lan
      # Native matrix below also exercises the Linux ARM64 guest on xbabe4.
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: shared-levels-source
      - run: bash ops/ci/shared-levels.sh contracts
  torch:
    strategy:
      fail-fast: false
      matrix:
        suite: [test_models, test_training, test_comparison, test_validation, test_v2, test_landmark_inputs, test_precalc, test_observed_landmarks, test_landmark_views, test_encoder_629, test_optional_landmarks]
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: shared-levels-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference runtime
        run: bash ops/ci/shared-levels.sh prepare-torch
      - name: Run the independent conformance shard
        env:
          SUITE: ${{ matrix.suite }}
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: bash ops/ci/shared-levels.sh torch "$SUITE"
  native:
    strategy:
      fail-fast: false
      matrix:
        arch: [X64, ARM64]
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, '${{ matrix.arch }}', lan-ci, ubuntu24]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: shared-levels-source
      - name: Install pinned Rust compiler in disposable Linux guest
        run: bash ops/ci/shared-levels.sh prepare-native
      - name: Run native graph and recipient-only parity
        env:
          CARGO_TARGET_DIR: target/shared-native
        run: bash ops/ci/shared-levels.sh native
