name: Native landmarks and release boundaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-landmarks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native-landmarks-source

jobs:
  native-landmarks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: native-landmarks-source
          persist-credentials: false
      - name: Provision native build tools in the disposable guest
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o DPkg::Options::="--force-unsafe-io" -o Acquire::Queue-Mode=access install -y --no-install-recommends rustup build-essential
      - name: Pin native toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            native-landmarks-source/engine/target
          key: native-landmarks-isolated-ubuntu24-rust188-${{ hashFiles('native-landmarks-source/engine/Cargo.lock') }}
      - name: Native signatures and level export invariants
        env:
          RAYON_NUM_THREADS: '2'
        run: bash ops/ci/landmarks.sh
