name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision CPU tools before tests in the disposable guest
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y rustup latexmk poppler-utils texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-pictures texlive-publishers just ripgrep strace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-cpu-lan-ubuntu24-x86-64-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
      - name: CPU tests and external learner smoke
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          RUSTFLAGS: '-C target-cpu=x86-64'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: bash ops/ci/cpu.sh

      - name: R10 privacy summary study fixtures
        run: target/ci-python/bin/python -B -m unittest research.transfer.privacy.test_summary_study -v

      - name: U04 observational admissions fixtures
        run: target/ci-python/bin/python -B examples/public-regression/bikeshare-observational/test_runner.py

      - name: U03 simulated healthcare CLI journey
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          RUSTFLAGS: '-C target-cpu=x86-64'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: |
          out=target/healthcare-sim
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py prepare --out "$out"
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py verify --out "$out"
          cargo build --locked --bin dope-kernel
          target/debug/dope-kernel compile-csv --csv "$out/fit.csv" \
            --target event_30d --candidate chow_liu --seed 1729 \
            --deadline-seconds 60 --out "$out/model.dpk"
          target/debug/dope-kernel sample-mixed --artifact "$out/model.dpk" \
            --rows 640 --seed 1729 --out "$out/sampled.json"
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py evaluate \
            --out "$out" --sampled "$out/sampled.json"
          rm -rf "$out"

      - name: Verify public claims and golden parity
        run: |
          target/ci-python/bin/python tools/claims/check.py
          target/ci-python/bin/python tools/claims/render.py --check
          target/ci-python/bin/python -m research.transfer.tdl.golden --check

  paper-clean:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
      - name: Install paper toolchain in the disposable guest
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y latexmk poppler-utils texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-pictures texlive-publishers just ripgrep
          uv venv target/paper-python
          uv pip install --python target/paper-python/bin/python --constraint validation/requirements-v1.txt numpy scipy pandas 'matplotlib==3.10.8'
      - name: Authenticate, clean rebuild, and require zero output drift
        run: |
          export PATH="$PWD/target/paper-python/bin:$PATH"
          bash ops/ci/paper-clean.sh

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain manager in the disposable guest
        run: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=300 install -y rustup strace ripgrep
      - name: Dependency advisory scan
        run: bash ops/ci/security.sh
      - name: Verify Cargo advisories
        run: cargo audit
      - name: Verify workflow syntax
        run: actionlint .github/workflows/*.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify workflow security
        run: |
          python3 -m venv target/workflow-lint
          target/workflow-lint/bin/pip install zizmor==1.25.2
          target/workflow-lint/bin/zizmor --offline .github/workflows
      - name: Verify secret scan
        run: gitleaks detect --source . --no-banner --redact
      - name: SPDX SBOM
        uses: anchore/sbom-action@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          path: .
          artifact-name: dope-sbom.spdx.json
          output-file: target/security/sbom.spdx.json
      - name: Q03 native release and installer smoke
        run: |
          cargo fetch --locked
          bash ops/ci/native-release-smoke.sh

  arm64-portability:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, ARM64, lan-ci, ubuntu24]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
      - name: Verify ARM64 claims, figure provenance, and packet portability
        run: |
          uname -a
          if ! command -v pdftotext >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo apt-get update
              sudo apt-get -o DPkg::Lock::Timeout=300 install -y poppler-utils
            else
              mkdir -p "$RUNNER_TEMP/apt-lists" "$RUNNER_TEMP/apt-cache/partial" "$RUNNER_TEMP/apt-debs" "$RUNNER_TEMP/poppler-root"
              cp -a /var/lib/apt/lists/* "$RUNNER_TEMP/apt-lists/" 2>/dev/null || true
              if ! apt-cache -o Dir::State::lists="$RUNNER_TEMP/apt-lists" -o Dir::Cache="$RUNNER_TEMP/apt-cache" show poppler-utils >/dev/null 2>&1; then
                apt-get -o Dir::State::lists="$RUNNER_TEMP/apt-lists" -o Dir::Cache="$RUNNER_TEMP/apt-cache" -o Debug::NoLocking=1 update
              fi
              mapfile -t pkgs < <(apt-get -o Dir::State::lists="$RUNNER_TEMP/apt-lists" -o Dir::Cache="$RUNNER_TEMP/apt-cache" -s install poppler-utils | awk '/^Inst /{print $2}')
              echo "Resolved rootless poppler-utils closure: ${pkgs[*]}"
              test "${#pkgs[@]}" -gt 0
              (cd "$RUNNER_TEMP/apt-debs" && apt-get -o Dir::State::lists="$RUNNER_TEMP/apt-lists" -o Dir::Cache="$RUNNER_TEMP/apt-cache" download "${pkgs[@]}")
              for deb in "$RUNNER_TEMP/apt-debs"/*.deb; do
                dpkg-deb -x "$deb" "$RUNNER_TEMP/poppler-root"
              done
              export PATH="$RUNNER_TEMP/poppler-root/usr/bin:$PATH"
              export LD_LIBRARY_PATH="$RUNNER_TEMP/poppler-root/usr/lib/aarch64-linux-gnu:$RUNNER_TEMP/poppler-root/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
              echo "$RUNNER_TEMP/poppler-root/usr/bin" >> "$GITHUB_PATH"
              echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            fi
          fi
          command -v pdftotext
          ldd "$(command -v pdftotext)"
          if ldd "$(command -v pdftotext)" | grep -F "not found"; then exit 1; fi
          pdftotext -v
          test -n "$(pdftotext docs/whitepaper/dope-mfs.pdf - | head -c 64)"
          uv venv target/arm64-python
          uv pip install --python target/arm64-python/bin/python --constraint validation/requirements-v1.txt numpy scipy pandas 'matplotlib==3.10.8' pytest jsonschema
          target/arm64-python/bin/python -B tools/claims/check.py
          target/arm64-python/bin/python -B tools/claims/render.py --check
          target/arm64-python/bin/python -B -m unittest tools.claims.test_figure -v
          PYTHONPATH=docs/whitepaper/scripts target/arm64-python/bin/python -B -m unittest test_readme_benchmark test_figure_one test_hero_figure -v
          target/arm64-python/bin/pytest research/transfer/tests/test_workplan_acceptance.py -k "TestD19AndBlockerUnblockMatrix or TestQ02FreshUserAndPdfQa" -v
