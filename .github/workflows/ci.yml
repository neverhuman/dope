name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ci-source

jobs:
  cpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    # Job119248919772 exhausted60min near its final test groups; keep a finite cold-run allowance.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci-source
          persist-credentials: false
      - name: Provision CPU tools before tests in the disposable guest
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o DPkg::Options::="--force-unsafe-io" -o Acquire::Queue-Mode=access install -y --no-install-recommends rustup latexmk poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-publishers lmodern just ripgrep strace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # sccache owns compiled objects. Full target trees include Python environments
          # and generated evidence; their post-job tar exceeded the CPU job quota.
          key: rust-cpu-dependencies-ubuntu24-x86-64-v2-${{ hashFiles('ci-source/rust-toolchain.toml', 'ci-source/Cargo.lock', 'ci-source/engine/Cargo.lock') }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
      - name: CPU tests and external learner smoke
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          RUSTFLAGS: '-C target-cpu=x86-64'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: bash ops/ci/cpu.sh

      - name: R10 privacy summary study fixtures
        run: target/ci-python/bin/python -B -m unittest research.transfer.privacy.test_summary_study -v

      - name: U04 observational admissions fixtures
        run: target/ci-python/bin/python -B examples/public-regression/bikeshare-observational/test_runner.py

      - name: U03 simulated healthcare CLI journey
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          RUSTFLAGS: '-C target-cpu=x86-64'
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: |
          out=target/healthcare-sim
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py prepare --out "$out"
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py verify --out "$out"
          cargo build --locked --bin dope-kernel
          target/debug/dope-kernel compile-csv --csv "$out/fit.csv" \
            --target event_30d --candidate chow_liu --seed 1729 \
            --deadline-seconds 60 --out "$out/model.dpk"
          target/debug/dope-kernel sample-mixed --artifact "$out/model.dpk" \
            --rows 640 --seed 1729 --out "$out/sampled.json"
          target/ci-python/bin/python -B examples/healthcare-sim/demo.py evaluate \
            --out "$out" --sampled "$out/sampled.json"
          rm -rf "$out"

      - name: Verify public claims and golden parity
        run: |
          target/ci-python/bin/python tools/claims/check.py
          target/ci-python/bin/python tools/claims/render.py --check
          target/ci-python/bin/python -m research.transfer.tdl.golden --check

  paper-clean:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
      - name: Install paper toolchain in the disposable guest
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o DPkg::Options::="--force-unsafe-io" -o Acquire::Queue-Mode=access install -y --no-install-recommends latexmk poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-publishers lmodern just ripgrep
          uv venv target/paper-python
          uv pip install --python target/paper-python/bin/python --constraint validation/requirements-v1.txt numpy scipy pandas 'matplotlib==3.10.8' 'jsonschema==4.26.0'
      - name: Authenticate, clean rebuild, and require zero output drift
        run: |
          export PATH="$PWD/target/paper-python/bin:$PATH"
          bash ops/ci/paper-clean.sh
      - name: Upload the active preprint for PR review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dope-active-preprint
          path: |
            ci-source/target/paper/main.pdf
            ci-source/target/paper/supplement.pdf
            ci-source/target/paper/dope1.pdf
            ci-source/target/paper/dope1-supplement.pdf
            ci-source/target/paper/dope1-venue.pdf
          if-no-files-found: error
          retention-days: 14

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci-source
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain manager in the disposable guest
        run: sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true; sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true; sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o DPkg::Options::="--force-unsafe-io" -o Acquire::Queue-Mode=access install -y --no-install-recommends rustup strace ripgrep
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-security-cargo-tools-ubuntu24-x86-64-v1-${{ hashFiles('ci-source/rust-toolchain.toml', 'ci-source/Cargo.lock', 'ci-source/ops/merge_guard/Cargo.lock') }}
      - name: Dependency advisory scan
        run: bash ops/ci/security.sh
      - name: Verify Cargo advisories
        run: cargo audit
      - name: Verify workflow syntax
        run: actionlint .github/workflows/*.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify workflow security
        run: |
          python3 -m venv target/workflow-lint
          target/workflow-lint/bin/pip install zizmor==1.25.2
          target/workflow-lint/bin/zizmor --offline .github/workflows
      - name: Verify secret scan
        run: gitleaks detect --source . --no-banner --redact
      - name: SPDX SBOM
        uses: anchore/sbom-action@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          path: ci-source
          artifact-name: dope-sbom.spdx.json
          output-file: ci-source/target/security/sbom.spdx.json
      - name: Q03 native release and installer smoke
        run: |
          cargo fetch --locked
          bash ops/ci/native-release-smoke.sh
