name: Full Jankurai audit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: audit-source

jobs:
  jankurai-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: audit-source
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain manager in the disposable guest
        run: sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true; sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true; sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o DPkg::Options::="--force-unsafe-io" -o Acquire::Queue-Mode=access install -y --no-install-recommends rustup
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-security-cargo-tools-ubuntu24-x86-64-v1-${{ hashFiles('audit-source/rust-toolchain.toml', 'audit-source/Cargo.lock', 'audit-source/ops/merge_guard/Cargo.lock') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: 0.11.28
          enable-cache: true
          cache-local-path: audit-source/target/uv-cache
          cache-suffix: dope-audit-isolated-lan-py312-v2
          cache-dependency-glob: |
            audit-source/validation/requirements-v1.txt
            audit-source/research/benchmark/sdv-runtime.lock.json
            audit-source/ops/ci/audit.sh
          prune-cache: false
      - name: Fresh Python V1 boundary receipt
        run: bash ops/ci/audit.sh prepare
      - name: Proof routing, copy review, and Rust witness
        env:
          JANKURAI_COMPARISON_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: bash ops/ci/tool-adoption.sh
      - name: Use pinned auditor in following steps
        run: |
          bash ops/ci/install-jankurai.sh
          echo "$PWD/target/jankurai/jankurai-1.7.1-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Strict security evidence
        run: jankurai security run . --strict --profile ci --script tools/security-lane.sh --out target/jankurai/security/evidence.json
      - name: Full v1.7.1 Jankurai audit
        id: full
        uses: neverhuman/jankurai-audit@9a101cda4bc32059a2c2f20a92e6d4948256507f # verified v1.7.1 tag target
        with:
          path: audit-source
          release-tag: v1.7.1
          mode: standard
          fail-under: '85'
      - name: Pinned local equivalent and explicit full audit
        if: always()
        run: |
          bash ops/ci/install-jankurai.sh
          target/jankurai/jankurai-1.7.1-x86_64-unknown-linux-gnu/jankurai audit . --full --no-badge --mode standard --fail-under 85 --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl --no-score-history
      - name: Emit repair queue and hash-only report attestation
        if: always()
        run: bash agent/emit-audit-receipts.sh
      - name: Verify badge generator fixtures
        run: cargo test --manifest-path ops/merge_guard/Cargo.toml --target-dir target --locked --bin audit-proof
      - name: Generate exact-head full-audit badge and check committed snapshot
        if: always()
        run: |
          cargo build --manifest-path ops/merge_guard/Cargo.toml --target-dir target --locked --bin audit-proof
          target/debug/audit-proof badge --report target/jankurai/repo-score.json --expected-head "$(git rev-parse HEAD)" --check docs/readme/jankurai.svg
      - name: Upload pinned action report even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jankurai-action-v1.7.1
          path: ${{ steps.full.outputs.report-directory || 'audit-source/target/jankurai' }}
          if-no-files-found: warn
      - name: Upload local-equivalent JSON and Markdown even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jankurai-v1.7.1
          path: |
            audit-source/target/jankurai/repo-score.json
            audit-source/target/jankurai/score.svg
            audit-source/target/jankurai/score.json
            audit-source/target/jankurai/repo-score.md
            audit-source/target/jankurai/summary.md
            audit-source/target/jankurai/repair-queue.jsonl
            audit-source/target/jankurai/proof-plan.json
            audit-source/target/jankurai/proof-plan.md
            audit-source/target/jankurai/copy-code.json
            audit-source/target/jankurai/copy-code.md
            audit-source/target/jankurai/rust/witness-graph.json
            audit-source/target/jankurai/security/evidence.json
            audit-source/target/jankurai/repair-queue.json
            audit-source/target/jankurai/repair-log.json
            audit-source/target/jankurai/report-attestation.json
          if-no-files-found: warn
