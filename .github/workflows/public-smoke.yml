name: Public fork smoke

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: public-smoke-cargo-${{ hashFiles('Cargo.lock', 'engine/Cargo.lock', 'ops/merge_guard/Cargo.lock') }}
          restore-keys: public-smoke-cargo-
      - name: Run public fork smoke, engine tests, and golden parity
        run: bash ops/ci/public-smoke.sh
