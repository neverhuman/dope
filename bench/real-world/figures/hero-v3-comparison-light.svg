<text x="964" y="266" class="detail">DOPE ahead</text>
<text x="783" y="266" class="detail">79× DOPE</text>
<text x="336" y="288" class="">TVAE</text>
<g class="peer"><line x1="534.3" x2="570.8" y1="283" y2="283"/><circle cx="552.7" cy="283" r="5"/></g>
<text x="691" y="288" class="value">−3.9</text>
<text x="783" y="288" class="column">475 kB</text>
<text x="964" y="288" class="gain">+91.9  [71.9, 112.3]</text>
<text x="964" y="302" class="detail">DOPE ahead</text>
<text x="783" y="302" class="detail">266× DOPE</text>
<text x="336" y="324" class="">CTGAN</text>
<g class="peer"><line x1="487.4" x2="510.2" y1="319" y2="319"/><circle cx="498.6" cy="319" r="5"/></g>
<text x="691" y="324" class="value">−69.2</text>
<text x="783" y="324" class="column">1.05 MB</text>
<text x="964" y="324" class="gain">+157.1  [141.8, 173.6]</text>
<text x="964" y="338" class="detail">DOPE ahead</text>
<text x="783" y="338" class="detail">590× DOPE</text>
<text x="336" y="377" class="note">DOPE ahead means the paired interval is above zero. See the paper for guard decisions.</text>
<text x="24" y="411" class="note">95% family-bootstrap intervals  ·  100 matches a second real sample  ·  44 informative cells</text>
</svg>
