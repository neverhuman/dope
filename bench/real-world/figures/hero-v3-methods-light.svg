<title id="hero-title">Transfer Score vs. artifact size</title>
<desc id="hero-desc">DEV panel (11 families, 44 cells, 4×). Transfer Score = 100 × (1 + TRG); 100 = real twin. External methods have no byte cap. DOPE is the only generator inside the 2 KiB budget. Transfer Score with its 95% interval against the median emitted-file size on a log axis; a dashed line marks the 2 KiB budget and dotted lines mark controls. DOPE v3: Transfer Score 87.9 [81.1, 95.1], 1,787 B. Gaussian copula: Transfer Score 40.2 [27.9, 51.8], 140,675.5 B. CTGAN: Transfer Score −69.2 [−82.7, −55.2], 1,053,957.5 B. TVAE: Transfer Score −3.9 [−26.2, 17.8], 475,125.5 B. ARF: Transfer Score 77.2 [58.4, 90.0], 2,937,782.5 B. Controls: real twin 100.0; copy of the fitting rows 96.1.</desc>
