[package]
name = "dope-kernel"
version = "0.3.0-alpha.1"
edition = "2024"
description = "Native bounded symbolic probabilistic language for tabular data"
license = "MIT"
build = "build.rs"

[lib]
name = "dope_kernel"
path = "rust/lib.rs"

[[bin]]
name = "dope-kernel"
path = "rust/main.rs"

[[bin]]
name = "dope-bench"
path = "rust/bench.rs"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
libc = "0.2.180"
memmap2 = "0.9.10"
rayon = "1.11.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.8"
statrs = "0.18.0"
thiserror = "2.0.17"
zstd = "0.13.3"

[features]
default = []
gpu-training = ["dep:tch"]

[dependencies.tch]
version = "=0.20.0"
optional = true

[build-dependencies]
blake3 = "1.8.2"
cc = "1.2.49"
serde_json = "1.0.149"
sha2 = "0.10.8"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
