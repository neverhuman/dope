# RUSTSEC-2026-0459 affects libsqlite3-sys 0.30.1 through rusqlite 0.32.1.
# The patched line is rusqlite 0.41, and that crate requires Rust 1.89.
# This repository pins rustc 1.88.0 in rust-toolchain.toml and the CI scripts.
# The advisory is already in origin/main's lockfile. It was issued on
# 2026-11-09, after the last green security run on main. The ledger opens a
# caller-supplied database and then sets WAL, so this ignore is the MSRV hold.
# It is not a claim that the bug is unreachable. Remove this entry when the
# toolchain can move to 1.89 and rusqlite can move to 0.41.

[advisories]
ignore = ["RUSTSEC-2026-0459"]
informational_warnings = ["unmaintained", "unsound", "notice"]
