[package]
name = "dope-cli"
description = "The dope command: fit, sample, predict, inspect, encode, eval and frontier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dope"
path = "src/main.rs"

[dependencies]
dope-core = { path = "../dope-core" }
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true

[features]
default = []
cuda = ["dope-core/cuda"]
metal = ["dope-core/metal"]
