# DOPE 1.0 engine: the deployable, 100% Rust implementation.
#
# This is a standalone workspace with its own lockfile so the legacy research
# crate at the repository root (dope-kernel) is unaffected.
[workspace]
resolver = "2"
members = ["dope-core", "dope-cli", "dope-probes"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neverhuman/dope"
rust-version = "1.88"

[workspace.dependencies]
candle-core = "0.9"
candle-nn = "0.9"
safetensors = "0.7"
half = "2"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
sha2 = "0.10"
# Pure-Rust (safe code) brotli: the artifact's program container is one brotli stream.
brotli = "8"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
