[package]
edition = "2021"
name = "tch"
version = "0.20.0"
build = "build.rs"
description = "Rust wrappers for the PyTorch C++ api (libtorch)."
license = "MIT/Apache-2.0"
repository = "https://github.com/LaurentMazare/tch-rs"
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "tch"
path = "src/lib.rs"

[features]
cuda-tests = []
doc-only = ["torch-sys/doc-only"]
download-libtorch = ["torch-sys/download-libtorch"]
python-extension = ["torch-sys/python-extension"]
rl-python = ["cpython"]

[dependencies]
clap = { version = "4.2.4", features = ["derive"], optional = true }
cpython = { version = "0.7.1", optional = true }
half = { version = "2" }
image = { version = "0.24.5", optional = true }
lazy_static = { version = "1.3.0" }
libc = { version = "0.2.0" }
memmap2 = { version = "0.6.1", optional = true }
ndarray = { version = "0.16.1" }
rand = { version = "0.8" }
regex = { version = "1.6.0", optional = true }
safetensors = { version = "0.3.0" }
serde_json = { version = "1.0.96", optional = true }
thiserror = { version = "1" }
torch-sys = { version = "0.20.0" }
zip = { version = "=9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "time", "zstd"] }
