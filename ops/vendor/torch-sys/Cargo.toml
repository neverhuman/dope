[package]
edition = "2021"
name = "torch-sys"
version = "0.20.0"
build = "build.rs"
links = "tch"
description = "Low-level FFI bindings for the PyTorch C++ api (libtorch)."
license = "MIT/Apache-2.0"
repository = "https://github.com/LaurentMazare/tch-rs"
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "torch_sys"
path = "src/lib.rs"

[features]
doc-only = []
download-libtorch = ["ureq", "serde", "serde_json"]
python-extension = []

[dependencies]
libc = { version = "0.2.0" }

[build-dependencies]
anyhow = { version = "^1.0.60" }
cc = { version = "1.2" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ureq = { version = "2.6", features = ["json"], optional = true }
zip = { version = "=9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "time", "zstd"] }
